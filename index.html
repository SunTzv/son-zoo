<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Son.zoo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">
        <header>
            <h1>SON.ZOO!</h1>
            <span class="subtitle">← Pick an activity or don't, I am a placeholder text description →</span>
        </header>

        <main class="game-grid">

            <!-- Game 1: Quickle Blitz -->
            <a href="./quickle/index.html" class="goofy-card" style="background-color: #e3faf2;">
                <div class="card-title">QUICKLE</div>
                <img src="./assets/quickle.png" alt="Quickle Game Art" class="card-image" />
            </a>

            <!-- Game 2: 12-Note Keyboard -->
            <a href="./keyboard/index.html" class="goofy-card" style="background-color: #fff9db;">
                <div class="card-title">KEYBOARD</div>
                <img src="./assets/keyboard.png" alt="Keyboard Game Art" class="card-image" />
            </a>

            <!-- Game 3: What IF? Reactor -->
            <a href="./whatif/index.html" class="goofy-card" style="background-color: #e5faff;">
                <div class="card-title">WHAT IF??</div>
                <img src="./assets/whatif.png" alt="What If Game Art" class="card-image" />
            </a>

            <!-- Game 4: Pics Go Brrr -->
            <a href="./picsgobrrr/index.html" class="goofy-card" style="background-color: #ffe5e5;">
                <div class="card-title">PICS GO BRRR</div>
                <img src="./assets/picsgobrrr.png" alt="Pics Go Brrr Game Art" class="card-image" />
            </a>

            <!-- Game 5: Terms and Conditions -->
            <a href="./terms/index.html" class="goofy-card" style="background-color: #f3e5f5;">
                <div class="card-title">T&amp;C</div>
                <img src="./assets/terms.png" alt="Terms and Conditions Game Art" class="card-image" />
            </a>

        </main>

        <footer>
            <p>🚨 Caution: Hovering over items may cause motion sickness or extreme satisfaction. 🚨</p>
        </footer>
    </div>

    <script src="site.js"></script>
</body>

</html>
