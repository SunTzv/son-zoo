<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Son.zoo</title>
    <link rel="icon" type="image/gif" href="./assets/cat.gif">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">
        <header style="position: relative; display: inline-block; width: 100%; text-align: center;">
            <div style="position: relative; display: inline-block;">
                <h1 id="spawn-cat-btn" style="cursor: pointer; margin: 0; display: inline-block;">
                    SON.ZOO!
                </h1>
                <div id="click-me-hint"
                    style="position: absolute; left: 100%; top: 50%; transform: translate(10px, -50%); color: #f44336; font-weight: bold; font-family: 'Comic Sans MS', cursive, sans-serif; pointer-events: none; white-space: nowrap; font-size: 1.2rem; animation: bounceX 1s infinite alternate;">
                    ← Click me!
                </div>
            </div>
            <br><br>
            <span class="subtitle">← Pick an activity or don't, I am a placeholder text description →</span>
        </header>

        <style>
            @keyframes bounceX {
                from {
                    transform: translate(10px, -50%);
                }

                to {
                    transform: translate(20px, -50%);
                }
            }

            body.hide-cursor,
            body.hide-cursor * {
                cursor: none !important;
            }
        </style>

        <main class="game-grid">

            <!-- Game 1: Quickle Blitz -->
            <a href="./quickle/index.html" class="goofy-card" style="background-color: #e3faf2;">
                <div class="card-title">QUICKLE</div>
                <img src="./assets/quickle.png" alt="Quickle Game Art" class="card-image" />
            </a>

            <!-- Game 2: 12-Note Keyboard -->
            <a href="./keyboard/index.html" class="goofy-card" style="background-color: #fff9db;">
                <div class="card-title">KEYBOARD</div>
                <img src="./assets/keyboard.png" alt="Keyboard Game Art" class="card-image" />
            </a>

            <!-- Game 3: What IF? Reactor -->
            <a href="./whatif/index.html" class="goofy-card" style="background-color: #e5faff;">
                <div class="card-title">WHAT IF??</div>
                <img src="./assets/whatif.png" alt="What If Game Art" class="card-image" />
            </a>

            <!-- Game 4: Pics Go Brrr -->
            <a href="./picsgobrrr/index.html" class="goofy-card" style="background-color: #ffe5e5;">
                <div class="card-title">PICS GO BRRR</div>
                <img src="./assets/picsgobrrr.png" alt="Pics Go Brrr Game Art" class="card-image" />
            </a>

            <!-- Game 5: Terms and Conditions -->
            <a href="./terms/index.html" class="goofy-card" style="background-color: #f3e5f5;">
                <div class="card-title">T&amp;C</div>
                <img src="./assets/terms.png" alt="Terms and Conditions Game Art" class="card-image" />
            </a>

        </main>

        <footer>
            <p>🚨 Caution: Hovering over items may cause motion sickness or extreme satisfaction. 🚨</p>
        </footer>
    </div>

    <!-- The Chasing Cat -->
    <img src="./assets/cat.gif" id="chasing-cat" alt="Chasing Cat"
        style="position:absolute; top:-100px; left:-100px; width:64px; pointer-events:none; z-index:9999; transition: transform 0.1s; display:none;">

    <!-- Cat State UI Elements -->
    <div id="cat-thought"
        style="position:absolute; display:none; background:white; border:2px solid black; border-radius:15px; padding:8px 12px; font-size:12px; z-index:10000; pointer-events:none; font-family: 'Comic Sans MS', cursive, sans-serif; box-shadow: 2px 2px 0 #000;">
        you cant get rid of me unless you click son.zoo
    </div>

    <div id="fence"
        style="position:absolute; top:30px; left:0px; width:20%; height:20%; display:none; cursor:pointer; z-index:9000; text-align:center; transition: transform 0.2s;"
        onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
        <img src="./assets/fence.png" alt="Fence"
            style="width:100%; height:100%; object-fit:contain; pointer-events:none;">
    </div>

    <div id="leash-item"
        style="position:absolute; top:30px; right:30px; width:60px; height:60px; display:none; cursor:pointer; z-index:9000; text-align:center; transition: transform 0.2s;"
        onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
        <img src="./assets/leash.png" alt="Leash"
            style="width:100%; height:100%; object-fit:contain; pointer-events:none;">
    </div>

    <svg id="leash-svg"
        style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:8000; display:none;">
        <line id="leash-line" x1="0" y1="0" x2="0" y2="0" stroke="red" stroke-width="3" stroke-dasharray="1,1" />
    </svg>

    <script src="site.js"></script>
    <script>
        // Chasing Cat Logic
        document.addEventListener("DOMContentLoaded", () => {
            const cat = document.getElementById("chasing-cat");
            const spawnBtn = document.getElementById("spawn-cat-btn");
            const hint = document.getElementById("click-me-hint");

            const catThought = document.getElementById("cat-thought");
            const fenceUI = document.getElementById("fence");
            const leashUI = document.getElementById("leash-item");
            const leashSvg = document.getElementById("leash-svg");
            const leashLine = document.getElementById("leash-line");

            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let catX = mouseX;
            let catY = mouseY;
            let currentDir = 1; // 1 for right, -1 for left
            let isSpinning = false;

            let catState = 'HIDDEN'; // HIDDEN, CURSOR, WAITING_FOR_LEASH, LEASHED
            let holdingLeash = false;
            const MAX_LEASH_LENGTH = 150;
            let wobbleTime = 4;

            const oiiaSound = new Audio('./assets/oiia.mp3');

            window.addEventListener("mousemove", (e) => {
                mouseX = e.pageX;
                mouseY = e.pageY;
            });

            spawnBtn.addEventListener("click", () => {
                if (catState === 'HIDDEN') {
                    catState = 'CURSOR';

                    // Hide system cursor globally
                    document.body.classList.add("hide-cursor");

                    // Hide the hint
                    hint.style.display = "none";

                    // Show the cat at the center of the screen
                    cat.style.display = "block";

                    // Delay the thought bubble for 6 seconds
                    setTimeout(() => {
                        if (catState === 'CURSOR') {
                            catThought.style.display = "block";
                        }
                    }, 6000);

                    catX = window.scrollX + window.innerWidth / 2;
                    catY = window.scrollY + window.innerHeight / 2;

                    // Unlock audio context via this click
                    oiiaSound.play().then(() => {
                        oiiaSound.pause();
                        oiiaSound.currentTime = 0;
                    }).catch(() => { });

                    // Start the chase
                    animateCat();
                } else if (catState === 'CURSOR') {
                    catState = 'WAITING_FOR_LEASH';
                    catThought.style.display = 'none';
                    fenceUI.style.display = 'block';
                    leashUI.style.display = 'block';
                }
            });

            leashUI.addEventListener("click", () => {
                if (catState === 'WAITING_FOR_LEASH') {
                    holdingLeash = true;
                    leashUI.style.display = 'none';
                }
            });

            fenceUI.addEventListener("click", () => {
                if (catState === 'WAITING_FOR_LEASH' && holdingLeash) {
                    catState = 'LEASHED';
                    // We get our cursor back!
                    document.body.classList.remove("hide-cursor");
                    leashSvg.style.display = 'block';
                }
            });

            function animateCat() {
                const dx = mouseX - catX;
                const dy = mouseY - catY;
                let nextX = catX;
                let nextY = catY;

                if (catState === 'CURSOR' || catState === 'WAITING_FOR_LEASH') {
                    // Instantly teleport cat to mouse (no delay)
                    nextX = mouseX;
                    nextY = mouseY;

                    if (catState === 'CURSOR') {
                        catThought.style.left = (catX + 30) + "px";
                        catThought.style.top = (catY - 40) + "px";
                    }
                } else if (catState === 'LEASHED') {
                    // Chase cursor with lerp
                    nextX = catX + dx * 0.05;
                    nextY = catY + dy * 0.05;

                    // Add wobble effect
                    wobbleTime += 0.1;
                    nextX += Math.sin(wobbleTime) * 20;
                    nextY += Math.cos(wobbleTime * 1.3) * 20;

                    // Constrain by leash to the fence
                    const fenceRect = fenceUI.getBoundingClientRect();
                    const fX = fenceRect.left + window.scrollX + fenceRect.width / 2;
                    const fY = fenceRect.top + window.scrollY + fenceRect.height / 2;

                    const fdx = nextX - fX;
                    const fdy = nextY - fY;
                    const distFromFence = Math.sqrt(fdx * fdx + fdy * fdy);

                    if (distFromFence > MAX_LEASH_LENGTH) {
                        const angle = Math.atan2(fdy, fdx);
                        nextX = fX + Math.cos(angle) * MAX_LEASH_LENGTH;
                        nextY = fY + Math.sin(angle) * MAX_LEASH_LENGTH;
                    }

                    // Update leash visual
                    leashLine.setAttribute("x1", fX);
                    leashLine.setAttribute("y1", fY);
                    leashLine.setAttribute("x2", nextX);
                    leashLine.setAttribute("y2", nextY);
                }

                // Determine new direction based on movement
                const moveDx = nextX - catX;
                const newDir = moveDx > 0 ? 1 : (moveDx < 0 ? -1 : currentDir);

                catX = nextX;
                catY = nextY;

                // If the cat changes direction (turns) and isn't already spinning, trigger the meme
                // (Disabled in LEASHED mode)
                if (catState !== 'LEASHED' && newDir !== currentDir && !isSpinning && Math.abs(dx) > 10) {
                    isSpinning = true;
                    currentDir = newDir;

                    cat.src = "./assets/oia-uia.gif";
                    cat.style.transform = `scaleX(1)`; // reset flip for the spinning gif

                    // Only play audio if it's not already playing
                    if (oiiaSound.paused || oiiaSound.ended) {
                        oiiaSound.currentTime = 0.03;
                        oiiaSound.play().catch(() => { });
                    }

                    // Stop spinning very quickly (just while turning)
                    setTimeout(() => {
                        isSpinning = false;
                        cat.src = "./assets/cat.gif";
                    }, 400); // 400ms instead of 2000ms
                }

                cat.style.left = (catX - 32) + "px"; // offset by half width
                cat.style.top = (catY - 32) + "px"; // offset by half height

                if (!isSpinning) {
                    cat.style.transform = `scaleX(${currentDir})`;
                }

                requestAnimationFrame(animateCat);
            }
        });
    </script>
</body>

</html>
