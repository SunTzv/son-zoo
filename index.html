<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Son.zoo - Goofy Web Games & Interactive Toys</title>
    <meta name="description" content="Step into Son.zoo, a collection of unique, quirky, and interactive web games, toys, and experiments built with modern web technologies.">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://suntzv.github.io/">
    <meta property="og:title" content="Son.zoo - Goofy Web Games & Interactive Toys">
    <meta property="og:description" content="Step into Son.zoo, a collection of unique, quirky, and interactive web games, toys, and experiments built with modern web technologies.">
    <meta property="og:image" content="https://suntzv.github.io/assets/cat.gif">

    <link rel="icon" type="image/gif" href="./assets/cat.gif">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">
        <header style="position: relative; display: inline-block; width: 100%; text-align: center;">
            <div style="position: relative; display: inline-block;">
                <h1 id="spawn-cat-btn" style="cursor: pointer; margin: 0; display: inline-block;">
                    SON.ZOO!
                </h1>
                <div id="click-me-hint"
                    style="position: absolute; left: 100%; top: 50%; transform: translate(10px, -50%); color: #f44336; font-weight: bold; font-family: 'Comic Sans MS', cursive, sans-serif; pointer-events: none; white-space: nowrap; font-size: 1.2rem; animation: bounceX 1s infinite alternate;">
                    ← Click me!
                </div>
            </div>
            <br><br>
            <span class="subtitle">← Pick an activity or don't, I am a placeholder text description →</span>
        </header>

        <style>
            @keyframes bounceX {
                from {
                    transform: translate(10px, -50%);
                }

                to {
                    transform: translate(20px, -50%);
                }
            }

            body.hide-cursor,
            body.hide-cursor * {
                cursor: none !important;
            }
        </style>

        <main class="game-grid">

            <!-- Game 1: Quickle Blitz -->
            <a href="./quickle/" class="goofy-card" style="background-color: #e3faf2;">
                <div class="card-title">QUICKLE</div>
                <img src="./assets/quickle.png" alt="Quickle Game Art" class="card-image" />
            </a>

            <!-- Game 2: 12-Note Keyboard -->
            <a href="./keyboard/" class="goofy-card" style="background-color: #fff9db;">
                <div class="card-title">KEYBOARD</div>
                <img src="./assets/keyboard.png" alt="Keyboard Game Art" class="card-image" />
            </a>

            <!-- Game 3: What IF? Reactor -->
            <a href="./whatif/" class="goofy-card" style="background-color: #e5faff;">
                <div class="card-title">WHAT IF??</div>
                <img src="./assets/whatif.png" alt="What If Game Art" class="card-image" />
            </a>

            <!-- Game 4: Pics Go Brrr -->
            <a href="./picsgobrrr/" class="goofy-card" style="background-color: #ffe5e5;">
                <div class="card-title">PICS GO BRRR</div>
                <img src="./assets/picsgobrrr.png" alt="Pics Go Brrr Game Art" class="card-image" />
            </a>

            <!-- Game 5: Unsubscribe Nazism -->
            <a href="./terms/" class="goofy-card" style="background-color: #f3e5f5;">
                <div class="card-title">UNSUB NAZI</div>
                <img src="./assets/terms.png" alt="Unsub Nazi Vol.1" class="card-image" />
            </a>

            <!-- Game 6: Gas is Lighter -->
            <a href="./gaslighter/" class="goofy-card" style="background-color: #e5ffe5;">
                <div class="card-title">GAS IS LIGHTER</div>
                <img src="./assets/gaslighter.png" alt="Gas is Lighter Art" class="card-image" />
            </a>

            <!-- Game 7: Blowfish -->
            <a href="./blowfish/" class="goofy-card" style="background-color: #f0f4f8;">
                <div class="card-title">BLOWFISH</div>
                <img src="./assets/blowfish.gif" alt="Blowfish Game Art" class="card-image" style="border-radius: 8px; object-fit: cover; aspect-ratio: 1 / 1; width: 100%;" />
            </a>

            <!-- Game 8: Chess Two -->
            <!-- ARCHIVED -->
            <a hidden href="./archived/chesstwo/" class="goofy-card" style="background-color: #fce4ec;">
                <div class="card-title">CHESS TWO</div>
                <img src="./assets/chess_pieces/knight-w.svg" alt="Chess Two Art" class="card-image" />
            </a>

        <!-- Game 9: Snakes & Ladders -->
            <a href="./snakes_and_ladders/" class="goofy-card" style="background-color: #bae6fd; text-decoration: none;">
                <div class="card-title">SNAKES & LADDERS</div>
                <img src="./assets/snake_and_ladder.png" alt="Snakes and Ladders Art" class="card-image" />
            </a>

        </main>

        <footer>
            <p>🚨 Caution: Hovering over items may cause motion sickness or extreme satisfaction. 🚨</p>
        </footer>
    </div>



    <script src="site.js"></script>
    <script>
        // Chasing Cat Logic has been moved to site.js for site-wide persistence
    </script>
</body>

</html>
