<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pics Go Brrr - Daily Sliding Puzzle Game | Son.zoo</title>
    <meta name="description" content="Solve the daily sliding puzzle with custom grid sizes, or do the math to let the puzzle solve itself. A new image every day!">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://suntzv.github.io/picsgobrrr/">
    <meta property="og:title" content="Pics Go Brrr - Daily Sliding Puzzle Game | Son.zoo">
    <meta property="og:description" content="Solve the daily sliding puzzle with custom grid sizes, or do the math to let the puzzle solve itself. A new image every day!">
    <meta property="og:image" content="https://suntzv.github.io/assets/picsgobrrr.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="picsgobrrr.css">
</head>

<body class="pics-page">
    <a href="../index.html" class="back-button">← BACK</a>

    <main class="game-container">
        <div class="board-wrapper">
            <div id="loading-overlay" class="overlay hidden">
                <p>Loading Image...</p>
            </div>
            <div id="error-overlay" class="overlay hidden">
                <p>No image for this date! Try another one.</p>
            </div>
            <div id="win-overlay" class="overlay hidden">
                <h2>YOU DID IT!</h2>
                <p id="win-message">Picture is fixed.</p>
                <button id="play-again-btn" class="goofy-btn">PLAY AGAIN</button>
            </div>

            <div class="hud-panel">
                <div id="moves-counter">MOVES: 0</div>
                <div id="target-counter">TARGET: 0</div>
            </div>

            <div id="puzzle-board" class="puzzle-board show-numbers">
                <!-- Tiles will be injected here by JS -->
            </div>
        </div>

        <div class="right-panel">
            <header class="game-header">
                <h1>PICS GO BRR</h1>
                <p class="subtitle">A daily sliding puzzle.</p>
            </header>

            <div class="controls-panel">
                <a href="archive.html" class="goofy-btn">ARCHIVE</a>

                <div class="control-group">
                    <button id="grid-btn" class="goofy-btn" data-grid="4">GRID: 4x4</button>
                </div>

                <button id="shuffle-btn" class="goofy-btn">SHUFFLE & START</button>
                
                <button id="toggle-numbers-btn" class="goofy-btn">NUMBERS: ON</button>

                <button id="auto-solve-btn" class="goofy-btn hidden">DO THE MATH FOR ME</button>
            </div>
        </div>
    </main>

    <script src="../site.js"></script>
    <script src="picsgobrrr.js"></script>
</body>

</html>
