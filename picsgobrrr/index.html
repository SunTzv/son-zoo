<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Son.zoo</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="picsgobrrr.css">
</head>

<body class="pics-page">
    <a href="../index.html" class="back-button">← BACK</a>

    <header class="game-header">
        <h1>PICS GO BRRR</h1>
        <p class="subtitle">A daily sliding puzzle. Can you fix the picture?</p>
    </header>

    <main class="game-container">
        <div class="controls-panel">
            <a href="archive.html" class="goofy-btn" style="text-decoration: none;">ARCHIVE</a>

            <div class="control-group">
                <button id="grid-btn" class="goofy-btn" data-grid="4">GRID: 4x4</button>
            </div>

            <label class="custom-checkbox-wrapper">
                <input type="checkbox" id="toggle-numbers" checked>
                <span class="custom-checkmark"></span>
                <span class="checkbox-label">NUMBERS</span>
            </label>

            <button id="shuffle-btn" class="goofy-btn">SHUFFLE & START</button>
        </div>

        <div class="board-wrapper">
            <div id="loading-overlay" class="overlay hidden">
                <p>Loading Image...</p>
            </div>
            <div id="error-overlay" class="overlay hidden">
                <p>No image for this date! Try another one.</p>
            </div>
            <div id="win-overlay" class="overlay hidden">
                <h2>YOU DID IT!</h2>
                <p>Picture is fixed.</p>
                <button id="play-again-btn" class="goofy-btn">PLAY AGAIN</button>
            </div>

            <div id="puzzle-board" class="puzzle-board show-numbers">
                <!-- Tiles will be injected here by JS -->
            </div>
        </div>
    </main>

    <script src="../site.js"></script>
    <script src="picsgobrrr.js"></script>
</body>

</html>
