<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Son.zoo</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="picsgobrrr.css">
    <style>
        .archive-panel {
            background: var(--paper-white);
            padding: 3rem;
            border: 6px solid var(--ink-black);
            border-radius: 15px 255px 15px 225px/225px 15px 255px 15px;
            box-shadow: 10px 10px 0 var(--ink-black);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .archive-panel h2 {
            font-size: 2.5rem;
            margin: 0;
            color: var(--goofy-magenta);
        }

        .archive-input {
            font-size: 1.5rem;
            padding: 1rem;
            font-family: var(--font-heavy);
        }

        #calendar-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .month-section {
            text-align: center;
        }

        .month-section h3 {
            font-size: 1.8rem;
            margin: 0 0 1rem 0;
            text-transform: uppercase;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
        }

        .day-btn {
            font-size: 1.2rem;
            padding: 0.5rem;
        }
    </style>
</head>

<body class="pics-page">
    <a href="index.html" class="back-button">← BACK TO GAME</a>

    <header class="game-header">
        <h1>ARCHIVE</h1>
    </header>

    <main class="game-container">
        <div class="archive-panel">
            <h2>ARCHIVE</h2>
            <div id="calendar-container"></div>
        </div>
    </main>

    <script>
        const calendarContainer = document.getElementById('calendar-container');

        // Scanning from Jan 1, 2025 so older images (like your 15 Dec 2025 test) will be found!
        const startDate = new Date(2025, 0, 1); 
        const today = new Date();
        const endDate = today < startDate ? startDate : today;

        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        async function loadArchive() {
            try {
                // Fetch the directory contents directly from the GitHub API! 
                // This returns instantly with zero 404 spam.
                const response = await fetch('https://api.github.com/repos/suntzv/suntzv.github.io/contents/assets/daily_pics');
                if (!response.ok) throw new Error("GitHub API failed");
                const files = await response.json();
                
                // Extract valid dates from filenames (DD_MM_YYYY.png)
                const validDates = [];
                for (const file of files) {
                    if (file.name.endsWith('.png')) {
                        const parts = file.name.replace('.png', '').split('_');
                        if (parts.length === 3) {
                            validDates.push({
                                d: parseInt(parts[0], 10),
                                m: parseInt(parts[1], 10) - 1,
                                y: parseInt(parts[2], 10),
                                str: `${parts[2]}-${parts[1]}-${parts[0]}` // YYYY-MM-DD for URL
                            });
                        }
                    }
                }
                
                // Group by Year and Month
                const grouped = {};
                for (const dObj of validDates) {
                    const key = `${dObj.y}-${dObj.m}`;
                    if (!grouped[key]) grouped[key] = [];
                    grouped[key].push(dObj);
                }
                
                // Render from newest to oldest
                const keys = Object.keys(grouped).sort((a, b) => {
                    const [yA, mA] = a.split('-');
                    const [yB, mB] = b.split('-');
                    return new Date(yB, mB) - new Date(yA, mA);
                });
                
                for (const key of keys) {
                    const [yStr, mStr] = key.split('-');
                    const y = parseInt(yStr, 10);
                    const m = parseInt(mStr, 10);
                    
                    const monthDiv = document.createElement('div');
                    monthDiv.className = 'month-section';
                    
                    const monthTitle = document.createElement('h3');
                    monthTitle.textContent = `${months[m]} ${y}`;
                    monthDiv.appendChild(monthTitle);
                    
                    const daysGrid = document.createElement('div');
                    daysGrid.className = 'days-grid';
                    
                    // Sort days within the month from oldest to newest (1, 2, 3...)
                    grouped[key].sort((a, b) => a.d - b.d);
                    
                    for (const dObj of grouped[key]) {
                        const btn = document.createElement('button');
                        btn.className = 'goofy-btn day-btn';
                        btn.textContent = String(dObj.d).padStart(2, '0');
                        
                        btn.addEventListener('click', () => {
                            window.location.href = `index.html?date=${dObj.str}`;
                        });
                        
                        daysGrid.appendChild(btn);
                    }
                    
                    monthDiv.appendChild(daysGrid);
                    calendarContainer.appendChild(monthDiv);
                }
                
            } catch (err) {
                console.error("Failed to load archive via GitHub API.", err);
                calendarContainer.innerHTML = "<p>Failed to load archive. Are you offline?</p>";
            }
        }

        loadArchive();
    </script>
</body>

</html>
