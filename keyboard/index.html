<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Son.zoo - 3D Keyboard</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="keyboard.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
</head>

<body class="keyboard-page" oncontextmenu="return false;">
    <a href="../index.html" class="back-button" style="position: absolute; z-index: 100; top: 1rem; left: 1rem;">← GO BACK</a>
    <div id="loading-overlay" style="position: absolute; inset: 0; background: #111; color: #fff; display: flex; align-items: center; justify-content: center; z-index: 50; font-family: monospace; font-size: 1.5rem;">LOADING 3D STAGE...</div>
    <input type="file" id="midi-upload" accept=".mid,.midi" style="display: none;">
    <canvas id="three-canvas"></canvas>

    <script src="../site.js"></script>
    <script src="keyboard.js"></script>
</body>

</html>
