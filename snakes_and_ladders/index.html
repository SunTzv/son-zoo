<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes & Ladders - Play Solo, Local or Online PvP | Son.zoo</title>
    <meta name="description" content="Roll the dice and race to the finish line in a modern version of Snakes and Ladders. Play solo, local PvP hotseat, or online multiplayer.">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://suntzv.github.io/snakes_and_ladders/">
    <meta property="og:title" content="Snakes & Ladders - Play Solo, Local or Online PvP | Son.zoo">
    <meta property="og:description" content="Roll the dice and race to the finish line in a modern version of Snakes and Ladders. Play solo, local PvP hotseat, or online multiplayer.">
    <meta property="og:image" content="https://suntzv.github.io/assets/snake_and_ladder.png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Snakes & Ladders</h1>
        </header>
        
        <main>
            <div id="start-menu" class="modal">
                <div class="modal-content" style="max-width: 400px; width: 100%;">
                    <h2>Game Settings</h2>
                    
                    <div id="menu-main">
                        <p style="margin-bottom: 16px;">Select Game Mode</p>
                        <div class="mode-buttons">
                            <button class="btn-primary" onclick="navMenu('pieces', 'pve')">Solo (vs Bot)</button>
                            <button class="btn-primary" onclick="navMenu('pieces', 'local')">Local PvP (Hotseat)</button>
                            <button class="btn-primary" onclick="navMenu('online', null)">Online PvP</button>
                        </div>
                    </div>

                    <div id="menu-online" class="hidden">
                        <p style="margin-bottom: 16px;">Online Multiplayer</p>
                        <div class="mode-buttons">
                            <button class="btn-primary" onclick="navMenu('pieces', 'host')">Host Game</button>
                            <div style="display: flex; gap: 8px;">
                                <input type="text" id="join-id" placeholder="Room ID" style="flex:1; padding: 12px; border-radius: 8px; border: 2px solid var(--border); font-size: 1rem; width: 100%;">
                                <button class="btn-primary" style="width: auto; padding: 12px 24px;" onclick="joinLobby()">Join</button>
                            </div>
                            <button class="btn-primary" style="background: var(--text-muted); margin-top: 8px;" onclick="navMenu('main')">Back</button>
                        </div>
                        <p id="network-status" style="margin-top: 16px; color: var(--primary-dark); font-weight: bold;"></p>
                    </div>

                    <div id="menu-pieces" class="hidden">
                        <p style="margin-bottom: 16px;">Pieces per player?</p>
                        <div class="mode-buttons">
                            <button class="btn-primary" onclick="startGame(1)">1 Piece</button>
                            <button class="btn-primary" onclick="startGame(2)">2 Pieces</button>
                            <button class="btn-primary" onclick="startGame(3)">3 Pieces</button>
                            <button class="btn-primary" onclick="startGame(4)">4 Pieces</button>
                            <button class="btn-primary" style="background: var(--text-muted); margin-top: 8px;" onclick="navMenu('main')">Back</button>
                        </div>
                    </div>
                    
                    <div id="menu-lobby" class="hidden">
                        <p style="margin-bottom: 16px;">Waiting for opponent...</p>
                        <div style="background: var(--bg); padding: 16px; border-radius: 8px; margin-bottom: 16px;">
                            <p style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Your Room ID</p>
                            <h3 id="lobby-id" style="color: var(--primary-dark); letter-spacing: 2px; user-select: text; font-size: 1.5rem;">...</h3>
                        </div>
                        <p id="lobby-status" style="color: var(--text-muted); font-size: 0.9rem;">Share this ID with a friend.</p>
                        <button class="btn-primary" style="background: var(--text-muted); margin-top: 16px;" onclick="cancelLobby()">Cancel</button>
                    </div>
                </div>
            </div>

            <div class="board-container">
                <canvas id="gameCanvas" width="600" height="600"></canvas>
            </div>
            
            <aside class="ui-panel">
                <div class="status-card">
                    <p class="label">Current Turn</p>
                    <h2 id="player-status">You (Player)</h2>
                </div>
                
                <div class="dice-card">
                    <p class="label">Dice Roll</p>
                    
                    <div class="scene">
                        <div class="cube" id="dice">
                            <div class="cube__face cube__face--front"><span class="dot"></span></div>
                            <div class="cube__face cube__face--back">
                                <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
                            </div>
                            <div class="cube__face cube__face--right">
                                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                            </div>
                            <div class="cube__face cube__face--left">
                                <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
                            </div>
                            <div class="cube__face cube__face--top">
                                <span class="dot"></span><span class="dot"></span>
                            </div>
                            <div class="cube__face cube__face--bottom">
                                <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
                            </div>
                        </div>
                    </div>

                    <p id="interaction-prompt" class="prompt-text"></p>
                    <button id="roll-btn" class="btn-primary">Roll the Dice!</button>
                </div>

                <div class="bases-card">
                    <div class="player-base">
                        <p class="label">Your Base</p>
                        <div class="pieces-container" id="base-human"></div>
                    </div>
                    <div class="player-base" style="margin-top: 16px;">
                        <p class="label" id="label-player2">Bot Base</p>
                        <div class="pieces-container" id="base-bot"></div>
                    </div>
                </div>
            </aside>
        </main>
    </div>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
