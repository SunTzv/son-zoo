<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Two - Play Stockfish AI | Son.zoo</title>
    <meta name="description" content="Play a challenging game of Chess against the Stockfish AI with custom difficulty levels and time controls.">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://suntzv.github.io/archived/chesstwo/">
    <meta property="og:title" content="Chess Two - Play Stockfish AI | Son.zoo">
    <meta property="og:description" content="Play a challenging game of Chess against the Stockfish AI with custom difficulty levels and time controls.">
    <meta property="og:image" content="https://suntzv.github.io/assets/chess_pieces/knight-b.svg">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="chesstwo.css">
</head>
<body class="chesstwo-page">
    <a href="../index.html" class="back-button">← BACK</a>

    <header class="game-header">
        <h1>CHESS TWO</h1>
        <div class="controls-row">
            <div class="control-group">
                <label>Time Control:</label>
                <select id="time-control">
                    <option value="600,0">10+0 Rapid</option>
                    <option value="180,2" selected>3+2 Blitz</option>
                    <option value="60,1">1+1 Bullet</option>
                </select>
            </div>
            <div class="control-group">
                <label>Bot Skill:</label>
                <select id="difficulty">
                    <option value="800">800 (Beginner)</option>
                    <option value="1400" selected>1400 (Intermediate)</option>
                    <option value="2000">2000 (Expert)</option>
                </select>
            </div>
            <button id="start-btn" class="goofy-btn">START GAME</button>
        </div>
    </header>

    <div class="main-layout">
        <div class="game-column">
            <div class="player-card bot-card">
                <div class="avatar-group">
                    <div class="avatar"><img src="../../assets/chess_pieces/knight-b.svg" alt="Bot Avatar"></div>
                    <div class="info">
                        <div class="name">Stockfish</div>
                        <div class="elo" id="bot-elo">1400</div>
                    </div>
                </div>
                <div class="clock" id="bot-clock">03:00</div>
            </div>

            <div class="board-container">
                <div id="chessboard" class="chessboard">
                    <!-- Squares injected by JS -->
                </div>
                <div id="highlights-layer">
                    <!-- Last move highlights and valid move dots -->
                </div>
                <div id="pieces-layer">
                    <!-- Pieces injected by JS absolutely -->
                </div>
                <!-- SVG Layer for drawing arrows and red highlights -->
                <svg id="drawing-layer" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <marker id="arrowhead" markerWidth="4" markerHeight="4" refX="2.5" refY="2" orient="auto">
                            <polygon points="0 0, 4 2, 0 4" fill="rgba(255, 170, 0, 0.8)" />
                        </marker>
                    </defs>
                    <g id="draw-highlights"></g>
                    <g id="draw-arrows"></g>
                </svg>
            </div>

            <div class="player-card user-card">
                <div class="avatar-group">
                    <div class="avatar"><img src="../../assets/chess_pieces/king-w.svg" alt="Player Avatar"></div>
                    <div class="info">
                        <div class="name">Player</div>
                        <div class="elo">472</div>
                    </div>
                </div>
                <div class="clock" id="player-clock">03:00</div>
            </div>
            
            <div id="status-message">Press Start to play.</div>
        </div>

        <div class="sidebar-column">
            <div class="move-log-container">
                <div class="move-log-header">Moves</div>
                <div id="move-log" class="move-log">
                    <!-- Move history injected by JS -->
                </div>
                <div class="move-log-controls">
                    <button id="btn-start" title="Go to start">⏮</button>
                    <button id="btn-prev" title="Previous move">◀</button>
                    <button id="btn-next" title="Next move">▶</button>
                    <button id="btn-end" title="Go to end">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="snd-move" src="../../assets/sounds/move-self.mp3"></audio>
    <audio id="snd-capture" src="../../assets/sounds/capture.mp3"></audio>
    <audio id="snd-check" src="../../assets/sounds/move-check.mp3"></audio>
    <audio id="snd-promote" src="../../assets/sounds/promote.mp3"></audio>
    <audio id="snd-start" src="../../assets/sounds/game-start.mp3"></audio>
    <audio id="snd-end" src="../../assets/sounds/game-end.mp3"></audio>
    <audio id="snd-illegal" src="../../assets/sounds/illegal.mp3"></audio>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="chesstwo.js"></script>
</body>
</html>
