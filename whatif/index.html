<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Son.zoo</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="whatif.css">
</head>

<body class="whatif-page">
        <a href="../index.html" class="back-button">← BACK</a>

        <div class="whatif-stage">
            <!-- Setup Screen -->
            <div id="setup-screen" class="setup-panel">
                <h1>WHAT IF??</h1>
                <p class="subtitle">Alter the course of history and see what happens...</p>
                <textarea id="prompt-input" class="prompt-input" placeholder="e.g. the Irish famine never happened..."
                    rows="3"></textarea>
                <button id="simulate-btn" class="simulate-btn">SIMULATE TIMELINE</button>
            </div>

            <!-- Timeline Screen -->
            <div id="timeline-screen" class="timeline-screen hidden">
                <h2 id="timeline-title" class="timeline-title">SIMULATING...</h2>
                <div id="timeline-container" class="timeline-container">
                    <!-- Events injected here by JS -->
                </div>
                <button id="restart-btn" class="restart-btn hidden">CHANGE HISTORY AGAIN</button>
            </div>
        </div>
    <script src="../site.js"></script>
    <script src="whatif.js"></script>
</body>

</html>
